summary: >-
  BBDO Worldwide publishes no developer portal and no OpenAPI, but bbdo.com is a
  WordPress site (hosted on WP Engine, fronted by Cloudflare) whose WordPress
  REST API is left open for anonymous reads. The route discovery document at
  https://bbdo.com/wp-json/ is a real, machine-readable contract served from
  BBDO's own host: it names the site ("BBDO", url https://bbdo.com), enumerates
  10 namespaces and 200 routes, and declares the supported authentication
  mechanism. Two of the registered post types are BBDO's own editorial content
  models — `work` (46 published campaign entries) and `news` (60 published
  items) — so this is not a generic install shell but the API behind the
  agency's public case-study and press archive. Recorded here because it is what
  BBDO actually serves; it is the WordPress platform's contract, not an API
  product BBDO designed, sells, documents, or supports.

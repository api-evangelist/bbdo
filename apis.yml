aid: bbdo
name: BBDO Worldwide
description: >-
  BBDO Worldwide is a global advertising agency network founded in 1928 and
  headquartered in New York City. It is the largest of the creative-agency
  networks owned by Omnicom Group, with roughly 15,000 employees across
  approximately 289 offices in 81 countries (per Wikipedia, citing company
  data). The agency's positioning is "Do Big Things," and its public work is
  campaign-led — Pepsi, Budweiser, McDonald's, M&M's, Snickers, Visa, AT&T
  Business, Volkswagen, Skoda, Whiskas, and many more. BBDO has been named
  Cannes Lions Network of the Year multiple times since 2007 and Network of
  the Decade in 2020. BBDO does not publish a developer portal, public REST
  APIs, OpenAPI specifications, SDKs, status page, or pricing — its product
  is creative work delivered to brand clients, not software offered to
  developers. The one machine-readable surface bbdo.com serves is the
  WordPress REST API behind the site itself: /wp-json/ answers anonymously
  with a 200-route discovery document, and the agency's own `work` and
  `news` custom post types are readable without credentials — 46 campaign
  case studies and 60 press items with draft-04 JSON Schemas available from
  each collection's OPTIONS response. That is a CMS byproduct, not a product
  BBDO designed, documents, prices, or supports. This repository indexes the
  public properties (homepage, network site, news, parent company, GitHub
  org, and notable agency network members), captures what the WordPress API
  actually serves, and links BBDO to its parent Omnicom and sibling networks
  (DDB Worldwide, TBWA Worldwide).
